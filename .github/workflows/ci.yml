name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      # Typecheck and lint currently report pre-existing failures, so they run
      # for visibility without blocking the job. Drop the continue-on-error
      # lines once the existing errors are cleared.
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true
